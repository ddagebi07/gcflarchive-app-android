org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin Multiplatform (:core, :student). iOS targets only build on a Mac with Xcode;
# elsewhere they are skipped quietly.
kotlin.native.ignoreDisabledTargets=true
kotlin.apple.xcodeCompatibility.nowarn=true
# 앱 버전 (사용자 앱·관리자 앱 공통). 배포할 때마다 0.0.1씩 올려요: 1.0.5 -> 1.0.6.
# versionCode는 여기서 계산해요 (1.0.5 -> 10005). iPhone/iPad 앱은 iosApp/project.yml과
# student/.../settings/SettingsScreen.kt의 APP_VERSION, core/.../Config.kt의 USER_AGENT도 같이 바꿔주세요.
gcflVersion=1.0.6
