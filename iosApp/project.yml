# Xcode project for the iPhone / iPad app, generated by XcodeGen:
#   brew install xcodegen && cd iosApp && xcodegen
# The UI and logic are the shared Kotlin modules (:student, :core); this target only hosts them.
name: GCFLArchive
options:
  bundleIdPrefix: kr.co.gcflarchive
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.21"
    CURRENT_PROJECT_VERSION: "10021"
    # Your Apple ID team (Xcode ▸ Settings ▸ Accounts). A free Apple ID works for your own iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app's bundle ID. If Xcode says it's taken, change it here only: the 급식 위젯 uses
    # "<this>.mealwidget" (an extension's ID must start with its app's).
    APP_BUNDLE_ID: kr.co.gcflarchive.student
packages:
  # 학교생활 푸시 (FCM → APNs). Firebase starts only when Student/GoogleService-Info.plist exists (PUSH_SETUP.md).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
targets:
  Student:
    type: application
    platform: iOS
    scheme: {}                                # shared scheme "Student" (needed by xcodebuild / CI)
    sources:
      - path: Student
    dependencies:
      # 홈 화면 위젯 (오늘의 급식), embedded in the app.
      - target: MealWidget
        embed: true
      # StudentApp.swift imports both, so both products must be linked (otherwise "No such module 'FirebaseCore'").
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
    # 푸시 알림 권한(aps-environment)은 유료 Apple Developer Program 계정에서만 서명돼요. 무료 Apple ID로는
    # 이 권한이 있으면 빌드가 실패하므로 기본으로 꺼 뒀어요. 가입한 뒤 아래 네 줄의 '#'를 지우고 xcodegen을 다시 실행하세요.
    # entitlements:
    #   path: Student/Student.entitlements
    #   properties:
    #     aps-environment: development
    settings:
      base:
        PRODUCT_NAME: GCFLArchive
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Student/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        # StudentKit.framework is built by Gradle (see the script phase below).
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../student/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "StudentKit"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    preBuildScripts:
      - name: Build StudentKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :student:embedAndSignAppleFrameworkForXcode

  # 홈 화면 위젯: 오늘의 급식. Pure Swift/WidgetKit; it reads NEIS itself, so no App Group is needed
  # (works with a free Apple ID too).
  MealWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MealWidget
    info:
      path: MealWidget/Info.plist
      properties:
        CFBundleDisplayName: 오늘의 급식
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: MealWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).mealwidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

