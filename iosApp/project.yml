# Xcode project for the iPhone / iPad app, generated by XcodeGen:
#   brew install xcodegen && cd iosApp && xcodegen
# The UI and logic are the shared Kotlin modules (:student, :core); this target only hosts them.
name: GCFLArchive
options:
  bundleIdPrefix: kr.co.gcflarchive
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "10005"
    # Your Apple ID team (Xcode ▸ Settings ▸ Accounts). A free Apple ID works for your own iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Student:
    type: application
    platform: iOS
    scheme: {}                                # shared scheme "Student" (needed by xcodebuild / CI)
    sources:
      - path: Student
    settings:
      base:
        PRODUCT_NAME: GCFLArchive
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.gcflarchive.student
        INFOPLIST_FILE: Student/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        # StudentKit.framework is built by Gradle (see the script phase below).
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../student/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "StudentKit"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    preBuildScripts:
      - name: Build StudentKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :student:embedAndSignAppleFrameworkForXcode
