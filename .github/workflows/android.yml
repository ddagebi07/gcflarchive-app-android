name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, build debug APK, lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gcfl-archive-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gcfl-admin-debug-apk
          path: admin/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            admin/build/reports/lint-results-debug.html
          if-no-files-found: ignore
